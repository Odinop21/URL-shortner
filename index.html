<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Url Shortener</title>
  </head>

  <body>
    <h1>Paste Your Url In the Box Below</h1>
    <form>
      <label for="longUrl">Long Link</label>
      <input
        type="text"
        id="longUrl"
        placeholder="Paste your long URL here"
        required
      />
      <input type="reset" />
      <input type="submit" />
    </form>
    <br /><br /><br />
    <div id="short">Your Short Url Is Ready:</div>
    <script>
      async function fetchData() {
        const longUrl = document.getElementById("longUrl").value; //Get the value of the long URL input field to check if it's empty before making the API call
        if (longUrl === "") {
          alert("Please enter a URL");
          return;
        }
        function isHttpvalid(longUrl) {
          try {
            const url = new URL(longUrl);
            return url.protocol === "http:" || url.protocol === "https:";
          } catch (error) {
            alert("Please enter a valid URL");
            return false;
          }
        }
        if (!isHttpvalid(longUrl)) {
          return;
        }

        try {
          let response = await fetch("http://localhost:3000/short", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              longUrl: document.getElementById("longUrl").value,
            }),
          });
          let data = await response.json();
          console.log("Shortened URL:", data);
          document.getElementById("short").innerHTML =
            "Your short Url :  " +
            `<a href ="http://localhost:3000/${data.shortUrl}" target= "_blank" >${data.shortUrl}</a>`;
        } catch (error) {
          console.error("Error fetching shortened URL:", error);
        }
      }

      document
        .querySelector('input[type="submit"]')
        .addEventListener("click", (event) => {
          console.log("button clicked!");
          event.preventDefault();
          fetchData();
        });

      document
        .querySelector('input[type="submit"]')
        .addEventListener("click", (event) => {
          //event listener for the submit button to trigger the fetchData function when clicked, and prevent the default form submission behavior
          console.log("button clicked!");
          event.preventDefault();
          fetchData();
        });
      // const resetButton = document.querySelector('input[type = "reset"]');
      // const shortUrlDisplay = document.getElementById("short");
      document
        .querySelector('input[type = "reset"]')
        .addEventListener("click", (event) => {
          //event listener for the reset button to trigger the reset of the form and clear the shortened URL display when clicked, and prevent the default form reset behavior
          console.log("Reset Initated !");
          document.getElementById("short").innerHTML = "";
          document.getElementById('input[type="reset"]').innerHTML = "";
          event.preventDefault();
        });
    </script>
  </body>
</html>
