<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Url Shortener</title>
  </head>

  <body>
    <h1>Paste Your Url In the Box Below</h1>
    <form>
      <label for="longUrl">Long Link</label>
      <input
        type="text"
        id="longUrl"
        placeholder="Paste your long URL here"
        required
      />
      <input type="reset" />
      <input type="submit" />
    </form>
    <br /><br /><br />
    <div id="short">Your Short Url Is Ready:</div>
    <script>
      async function fetchData() {
        //Asynchronous function to handle the form submission and fetch the shortened URL from the server
        const longUrl = document.getElementById("longUrl").value; //Get the value of the long URL input field to check if it's empty before making the API call
        if (longUrl === "") {
          alert("Please enter a URL");
          return;
        }
        function isHttpvalid(longUrl) {
          try {
            const url = new URL(longUrl);
            return url.protocol === "http:" || url.protocol === "https:";
          } catch (error) {
            alert("Please enter a valid URL");
            return false;
          }
        }
        if (!isHttpvalid(longUrl)) {
          return;
        }

        const string = longUrl;
        function isValidURL(longUrl) {
          try {
            new URL(longUrl);
            return true;
          } catch (err) {
            alert("Invalid URL!!!! Please enter a valid URL.");
            return false;
          }
        }
        isValidURL();

        try {
          let response = await fetch("odins-url-shortner.up.railway.app/", {
            //Make a POST request to the server's /short endpoint with the long URL in the request body as JSON
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              longUrl: document.getElementById("longUrl").value,
            }),
          });

          let data = await response.json(); //Parse the response as JSON to access the shortened URL data returned by the server
          // console.log("Shortened URL:", data);
          document.getElementById("short").innerHTML =
            "Your short Url :  " +
            `<a href ="odins-url-shortner.up.railway.app/${data.shortUrl}" target= "_blank">odins-url-shortner.up.railway.app/${data.shortUrl}</a>`;
        } catch (error) {
          console.error("Error fetching shortened URL:", error);
        }
      }

      document
        .querySelector('input[type="submit"]')
        .addEventListener("click", (event) => {
          console.log("button clicked!");
          console.log("button clicked!");
          document.getElementById("short").innerHTML = "";
          event.preventDefault();
          fetchData();
        });
    </script>
  </body>
</html>
