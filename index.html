<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Url Shortener</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #000000;
        color: #ffffff;
      }

      form {
        display: inline-block;
        margin-top: 20px;
      }

      input[type="text"] {
        width: 300px;
        padding: 10px;
        margin-right: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      input[type="submit"],
      input[type="reset"] {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
      }

      input[type="submit"]:hover,
      input[type="reset"]:hover {
        background-color: #0056b3;
      }

      #short {
        margin-top: 30px;
        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <h1>Paste Your Url In the Box Below</h1>
    <form>
      <label for="longUrl">Long Link</label>
      <input
        type="text"
        id="longUrl"
        placeholder="Paste your long URL here"
        required
      />
      <input type="reset" />
      <input type="submit" />
    </form>
    <br /><br /><br />
    <div id="short">Your Short Url Is Ready:</div>
    <script>

      async function fetchData() { //Asynchronous function to handle the form submission and fetch the shortened URL from the server
        const longUrl = document.getElementById("longUrl").value; //Get the value of the long URL input field to check if it's empty before making the API call
        if (longUrl === "") {
          alert("Please enter a URL");
          return;
        };
        //  const string = longUrl
        //  function isValidURL(string) {
          
        //   try {
        //     new URL(string);
        //     return true;
        //   } catch (err) {
        //     alert("Invalid URL!!!! Please enter a valid URL.");
        //     return false;
        //   }
        // }
        // isValidURL();

        // // To strictly allow only http/https protocols:
        //  function isHttpValid(string) {
        //   try {
        //    const url = new URL(longUrl);
        //     return url.protocol === "http:" || url.protocol === "https:";
        //   } catch (err) {
        //     alert("Invalid URL!!!! Please enter a valid URL.");
        //     return false;
        //   }}
        // isHttpValid();

        try {
          let response = await fetch("http://localhost:3000/short", { //Make a POST request to the server's /short endpoint with the long URL in the request body as JSON
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              longUrl: document.getElementById("longUrl").value,
            }),
          });

          let data = await response.json(); //Parse the response as JSON to access the shortened URL data returned by the server
          // console.log("Shortened URL:", data);
          document.getElementById("short").innerHTML =
            "Your short Url :  " +
            `<a href ="http://localhost:3000/${data.shortUrl}" target= "_blank">http://localhost:3000/${data.shortUrl}</a>`;
        } catch (error) {
          console.error("Error fetching shortened URL:", error);
        }}
      

      document.querySelector('input[type="submit"]').addEventListener("click", (event) => { //event listener for the submit button to trigger the fetchData function when clicked, and prevent the default form submission behavior
        console.log("button clicked!");
        event.preventDefault();
        fetchData();
      });
      // const resetButton = document.querySelector('input[type = "reset"]');
      // const shortUrlDisplay = document.getElementById("short");
       document.querySelector('input[type = "reset"]').addEventListener("click", (event) => { //event listener for the reset button to trigger the reset of the form and clear the shortened URL display when clicked, and prevent the default form reset behavior
        console.log("Reset Initated !");
        document.getElementById("short").innerHTML = "";
        document.getElementById('input[type="reset"]').innerHTML = "";
        event.preventDefault();
        
        
      });
    </script>
  </body>
</html>
